name: Playwright in Docker

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec/glob to run'
        required: false
        default: 'tests/qauto-pom/registration.spec.js'

jobs:
  playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    env:
      SPEC: ${{ github.event.inputs.spec }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Cache npm
        uses: actions/cache@v4.2.4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Pull Playwright Docker image v1.55.0-noble
        run: docker pull mcr.microsoft.com/playwright:v1.55.0-noble

      - name: Run Playwright inside Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/work \
            -v "$HOME/.npm":/root/.npm \
            -w /work \
            --ipc=host \
            --entrypoint /bin/bash \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            -lc 'set -euo pipefail && if [ -f package-lock.json ]; then npm ci; else npm i; fi >/dev/null 2>&1 && npx playwright install --with-deps >/dev/null 2>&1 && if [ -z "${SPEC:-}" ]; then SPEC="tests/qauto-pom/registration.spec.js"; fi && echo "Running: $SPEC" && npx playwright test "$SPEC" --reporter=html'

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: playwright-report/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright test-results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-test-results
          path: test-results/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright videos
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-videos
          path: |
            test-results/**/*.webm
            test-results/**/*.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5.0.0
        with:
          enablement: true

      - name: Upload Pages artifact (Playwright HTML report)
        if: always()
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Add report link to summary
        if: always()
        run: |
          echo "Playwright HTML report: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
